<!DOCTYPE html>
<html>
<head>
    <title>My Game Hub</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            font-size: 40px;
        }

        .game-card {
            background: #222;
            max-width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border: none;
            border-radius: 10px;
        }

        #result {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎮 My Game Hub</h1>
    <p>Welcome to my first website!</p>

    <div class="game-card">
        <h2>✊ Rock Paper Scissors</h2>
        <p>Choose your move:</p>

        <button onclick="play('rock')">✊ Rock</button>
        <button onclick="play('paper')">✋ Paper</button>
        <button onclick="play('scissors')">✌️ Scissors</button>

        <p id="result">Choose your move!</p>
        <p id="round">Round: 0</p>
        <p id="score">You: 0 | Computer: 0</p>
        <button onclick="resetGame()">🔄 Reset Game</button>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let round = 0;
        function play(playerChoice) {
            round++;  

            let choices = ["rock", "paper", "scissors"];

            let computerChoice =
                choices[Math.floor(Math.random() * 3)];

           let result;

if (playerChoice === computerChoice) {
    result = "Draw! 🤝";
} else if (
    (playerChoice === "rock" && computerChoice === "scissors") ||
    (playerChoice === "paper" && computerChoice === "rock") ||
    (playerChoice === "scissors" && computerChoice === "paper")
) {
    result = "You Win! 🏆";
} else {
    result = "Computer Wins! 🤖";
}

if (result === "You Win! 🏆") {
    playerScore++;
} else if (result === "Computer Wins! 🤖") {
    computerScore++;
    }
          document.getElementById("score").innerHTML =
    "You: " + playerScore +
    " | Computer: " + computerScore;
            document.getElementById("round").innerHTML =
    "Round: " + round;
            document.getElementById("result").innerHTML =
                "You: " + playerChoice +
                "<br>Computer: " + computerChoice +
             "<br>" + result;
        }
function resetGame() {
    playerScore = 0;
    computerScore = 0;
    round = 0;

    document.getElementById("score").innerHTML =
        "You: 0 | Computer: 0"; 
    
    document.getElementById("round").innerHTML =
    "Round: 0";

    document.getElementById("result").innerHTML =
        "Choose your move!";
        }
    </script>

</body>
</html>
