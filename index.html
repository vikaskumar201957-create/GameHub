<!DOCTYPE html>
<html>
<head>
    <title>My Game Hub</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
        }

        .game-card {
            background: #222;
            width: 280px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1>🎮 My Game Hub</h1>
    <p>Welcome to my first website!</p>

    <div class="game-card">
        <h2>✊ Rock Paper Scissors</h2>
        <p>Play the classic game!</p>

        <button onclick="startGame()">Play Now</button>

        <div class="choices">
            <button onclick="play('rock')">✊ Rock</button>
            <button onclick="play('paper')">✋ Paper</button>
            <button onclick="play('scissors')">✌️ Scissors</button>
        </div>

        <p id="result">Choose your move!</p>
    </div>

    <script>
        function startGame() {
            alert("Game starting! 🎮");
        }

        function play(playerChoice) {
            alert("You chose " + playerChoice);
        }
    </script>

</body>
</html>
